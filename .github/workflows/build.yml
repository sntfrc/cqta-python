name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest }
          - { os: ubuntu-22.04 }
          - { os: macos-14 }
          - { os: macos-13 }
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libdbus-1-3 libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - name: macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "CQTA_CODESIGN_IDENTITY=$MACOS_IDENTITY" >> "$GITHUB_ENV"
      - run: pip install -e .[build]
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cqta-${{ matrix.os }}
          path: |
            dist/cqta-*.exe
            dist/cqta-*.AppImage
            dist/cqta-*.dmg
