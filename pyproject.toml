[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqta"
dynamic = ["version"]
description = "CQta: IPv4 tunneling and amateur-radio style chat over Meshtastic, KISS TCP TNCs and AFSK audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pytap3>=3.1.2",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pyserial>=3.5",
    "bleak>=0.22",
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.scripts]
cqta = "cqta.__main__:main"

[project.gui-scripts]
cqta-gui = "cqta.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cqta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
